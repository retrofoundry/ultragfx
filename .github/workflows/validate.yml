name: validate
on:
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
jobs:
  # Compile-only checks (fmt + clippy). No GPU adapter needed, so these run on Linux.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: exact readback comparator rejection tests
        run: python -m unittest discover -s tools/readbacks -v
      - name: TMEM baselines and oracle policy tests
        run: python -m unittest discover -s tools/tmem -v
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (default)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (--all-features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: clippy (--features debug-ui)
        run: cargo clippy -p ultragfx --features debug-ui --all-targets -- -D warnings

  test-matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import sys

          sys.path.insert(0, "tools/readbacks")
          import ci

          entries = []
          for config in ci.COMMANDS:
              for section in (("library", "integration-docs") if config == "all-features" else ("",)):
                  name = f"macos-latest-{config}" + (f"-{section}" if section else "")
                  entries.append({"os": "macos-latest", "name": name, "configuration": config, "section": section})
          for config in ci.COMMANDS:
              for section in ci.windows_sections(Path.cwd(), config):
                  entries.append({"os": "windows-latest", "name": f"windows-latest-{config}-{section}",
                                  "configuration": config, "section": section})
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("include=" + json.dumps(entries) + "\n")

  test:
    needs: test-matrix
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test-matrix.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # WARP is a CPU rasterizer; parallel GPU tests starve each other and have crashed the
      # process with STATUS_ACCESS_VIOLATION.
      RUST_TEST_THREADS: ${{ matrix.os == 'windows-latest' && '1' || '4' }}
      RUST_BACKTRACE: 1
      WGPU_DX12_COMPILER: staticdxc
      RUST_TEST_NOCAPTURE: ${{ matrix.os == 'windows-latest' && '1' || '' }}
      RUST_LOG: wgpu_core=warn,wgpu_hal=warn
      WGPU_BACKEND: ${{ matrix.os == 'windows-latest' && 'dx12' || 'metal' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: configure DXC downloads
        shell: python
        run: |
          import os
          from pathlib import Path

          os.umask(0o077)
          directory = Path(os.environ["RUNNER_TEMP"]) / "dxc-curl"
          directory.mkdir()
          token = os.environ["GH_TOKEN"]
          netrc = directory / "netrc"
          netrc.write_text("".join(f"machine {host} login x-access-token password {token}\n"
                                   for host in ["github.com", "api.github.com"]), encoding="utf-8")
          config = (f'netrc-file = "{netrc.as_posix()}"\n'
                    'fail\nretry = 5\nretry-all-errors\nretry-delay = 2\nssl-revoke-best-effort\n')
          for name in [".curlrc", "_curlrc"]:
              (directory / name).write_text(config, encoding="utf-8")
      - name: bound Windows build resources
        if: runner.os == 'Windows'
        shell: bash
        run: |
          printf '%s\n' CARGO_BUILD_JOBS=2 CARGO_INCREMENTAL=0 \
            CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0 >> "$GITHUB_ENV"
      - name: test, export and compare exact base readbacks
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          CONFIGURATION: ${{ matrix.configuration }}
          SECTION: ${{ matrix.section }}
          CURL_HOME: ${{ runner.temp }}/dxc-curl
        run: |
          args=()
          if [ "$EVENT_NAME" = pull_request ]; then
            args+=(--base-checkout "${{ github.workspace }}/base")
          fi
          if [ -n "$CONFIGURATION" ]; then
            args+=(--configuration "$CONFIGURATION")
          fi
          if [ -n "$SECTION" ]; then
            args+=(--section "$SECTION")
          fi
          python "${{ github.workspace }}/candidate/tools/readbacks/ci.py" \
            --checkout "${{ github.workspace }}/candidate" \
            --output "${{ runner.temp }}/readbacks" \
            --base-sha "$BASE_SHA" \
            --artifact-name "readbacks-${{ matrix.name }}" "${args[@]}"
      - name: remove DXC download credentials
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          import shutil

          shutil.rmtree(Path(os.environ["RUNNER_TEMP"]) / "dxc-curl", ignore_errors=True)
      - name: publish candidate readbacks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readbacks-${{ matrix.name }}
          path: ${{ runner.temp }}/readbacks/candidate
          if-no-files-found: error
          retention-days: 90
      - name: publish base readbacks and comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readback-evidence-${{ matrix.name }}
          path: ${{ runner.temp }}/readbacks
          if-no-files-found: error
          retention-days: 90

  # Prove the library stays wasm-compatible (catches a native-only API / dep regression).
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build for wasm32
        run: cargo build -p ultragfx --target wasm32-unknown-unknown
      - name: build for wasm32 (--features capture)
        run: cargo build -p ultragfx --target wasm32-unknown-unknown --features capture
      - name: build for wasm32 (--features debug-ui)
        run: cargo build -p ultragfx --target wasm32-unknown-unknown --features debug-ui
      - name: build for wasm32 (--features capture,debug-ui)
        run: cargo build -p ultragfx --target wasm32-unknown-unknown --features capture,debug-ui

  browser:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
      WASM_BINDGEN_TEST_TIMEOUT: 300
    steps:
      - uses: actions/checkout@v4
      - name: install matching wasm-bindgen runner
        run: |
          version=$(cargo tree -p ultragfx --target wasm32-unknown-unknown --features capture -e normal,dev --prefix none \
            | awk '$1 == "wasm-bindgen" {print substr($2, 2); exit}')
          echo "wasm-bindgen $version"
          cargo install --locked wasm-bindgen-cli --version "$version"
      # The image's own Google Chrome and ChromeDriver. A downloaded Chrome for Testing cannot
      # reach its Mach rendezvous port on these runners and its network service crash-loops.
      - name: browser runner environment
        run: |
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
          "$CHROMEWEBDRIVER/chromedriver" --version
          echo "CHROMEDRIVER=$CHROMEWEBDRIVER/chromedriver" >> "$GITHUB_ENV"
          echo "WASM_BINDGEN_TEST_WEBDRIVER_JSON=$PWD/ultragfx/webdriver.json" >> "$GITHUB_ENV"
      - name: browser TMEM preimages
        run: cargo test -p ultragfx --features capture,profiling --target wasm32-unknown-unknown --test tmem_preimage --test rt64_v5 -- --nocapture
      - name: browser owned texture requests
        if: ${{ !cancelled() }}
        run: cargo test -p ultragfx --features capture,profiling --target wasm32-unknown-unknown --test owned_texture_requests -- --nocapture
      - name: browser TMEM IMAGE replay
        if: ${{ !cancelled() }}
        run: cargo test -p ultragfx --features capture,profiling --target wasm32-unknown-unknown --test tmem_fixture_replay -- --nocapture
      - name: browser TMEM compute and residency
        if: ${{ !cancelled() }}
        run: cargo test -p ultragfx --features capture,profiling --target wasm32-unknown-unknown --test texture_decode_gpu --test texture_residency --test texture_residency_pressure -- --nocapture
      - name: browser WebGPU replay
        if: ${{ !cancelled() }}
        run: |
          cargo test -p ultragfx --no-fail-fast --features capture,profiling --target wasm32-unknown-unknown \
            --test browser_sm64_fixture_replay --test capture_facade \
            --test capture_memory_wasm --test capture_s2dex_wasm --test profiling_capture \
            --test framebuffer_load_evidence --test upscaling -- --nocapture
